<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Симулятор «Один день учителя»: безпечний інфопростір</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#5b6478;--ac:#3b5bdb;--acs:#e7ecff;--ok:#1b7f4b;--oks:#e1f5ea;--wa:#9a5b00;--was:#fff1d6;--er:#b42318;--ers:#fde8e6;--bd:#d9deea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1b2030;--tx:#e8ebf4;--mu:#9aa3b8;--ac:#8fa6ff;--acs:#262e52;--ok:#6fdca0;--oks:#16352a;--wa:#ffc766;--was:#3a2e12;--er:#ff9b8f;--ers:#3d1c1a;--bd:#2d3550}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
.w.wide{max-width:1180px}
h1{font-size:1.35rem;margin:.2em 0}h2{font-size:1.1rem;margin:.2em 0 .5em}
.sub{color:var(--mu);margin:0 0 14px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-top:10px}
.tag{display:inline-block;background:var(--acs);color:var(--ac);border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:600}
.q{font-weight:700;margin:14px 0 8px}
button.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:11px 13px;border:1px solid var(--bd);border-radius:12px;margin:7px 0;cursor:pointer;background:var(--card);color:var(--tx);font:inherit}
button.o:hover{border-color:var(--ac)}
button.o b{color:var(--ac);flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.b{background:var(--ac);color:var(--bg);border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.b.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.box{border-radius:12px;padding:10px 14px;margin:10px 0}
.box.ok{background:var(--oks)}.box.wa{background:var(--was)}.box.in{background:var(--acs)}.box.er{background:var(--ers)}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.82rem;font-weight:600}
.chip.ok{background:var(--oks);color:var(--ok)}.chip.part{background:var(--was);color:var(--wa)}.chip.bad{background:var(--ers);color:var(--er)}.chip.in{background:var(--acs);color:var(--ac)}
ul,ol{padding-left:22px;margin:6px 0}
/* таймер */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 6px}
.tm{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 14px}
.tm .clock{font:700 1.5rem/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-width:84px}
.tm.warn{border-color:var(--wa)}.tm.warn .clock{color:var(--wa)}
.tm.crit{border-color:var(--er)}.tm.crit .clock{color:var(--er)}
.prog{flex:1;height:8px;background:var(--acs);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ac);transition:width .3s}
.tm.warn .prog i{background:var(--wa)}.tm.crit .prog i{background:var(--er)}
.steps{color:var(--mu);font-size:.85rem;white-space:nowrap}
/* повідомлення */
.msg{background:var(--bg);border-radius:14px;padding:12px 14px;margin:12px 0;border-left:4px solid var(--ac)}
.msg .hd{display:flex;justify-content:space-between;gap:10px;color:var(--mu);font-size:.85rem;margin-bottom:6px}
.msg .subj{font-weight:700;margin-bottom:4px}
.att{display:inline-block;margin-top:8px;padding:4px 10px;border:1px dashed var(--bd);border-radius:8px;font-size:.9rem}
.cons{border-left:4px solid var(--mu);background:var(--bg);border-radius:12px;padding:10px 14px;margin:12px 0}
/* алгоритм */
.alg{list-style:none;padding:0;margin:8px 0;counter-reset:a}
.alg li{counter-increment:a;display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--bd)}
.alg li:last-child{border-bottom:0}
.alg li:before{content:counter(a);flex:none;width:26px;height:26px;border-radius:50%;background:var(--ac);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.alg .st{font-weight:700;color:var(--ac);margin-right:4px}
/* ланцюжок */
.chain{list-style:none;padding:0;margin:8px 0}
.chain li{position:relative;padding:8px 0 10px 22px;border-left:2px solid var(--bd);margin-left:8px}
.chain li:before{content:"";position:absolute;left:-7px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--mu)}
.chain li.ok:before{background:var(--ok)}.chain li.part:before{background:var(--wa)}.chain li.bad:before{background:var(--er)}.chain li.miss:before{background:var(--bd)}
.chain li.miss{color:var(--mu);font-style:italic}
.chain .meta{font-size:.8rem;color:var(--mu)}
.code{font:700 1.05rem/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--bg);border:1px dashed var(--ac);border-radius:10px;padding:10px 12px;word-break:break-all;user-select:all}
textarea,input[type=number]{width:100%;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
input[type=number]{width:90px}
textarea{min-height:110px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.lnk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--bd)}
.lnk code{flex:1;min-width:200px;word-break:break-all;font-size:.82rem;background:var(--bg);padding:4px 8px;border-radius:8px}
.big{font-size:1.05rem}
details summary{cursor:pointer;font-weight:600;color:var(--ac)}
.gbtn{display:block;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer;margin:8px 0}
.gbtn:hover{border-color:var(--ac)}
.gbtn .t{font-weight:700}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media print{.bar,.row,.noprint{display:none!important}}
</style>
</head>

/* ---------- утиліти ---------- */
var app = document.getElementById("app");
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(sec){sec=Math.max(0,Math.round(sec));var m=Math.floor(sec/60),s=sec%60;return m+":"+(s<10?"0":"")+s}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(function(){e.classList.remove("on")},1600)}
function copy(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("Скопійовано")},function(){fallbackCopy(t)})}
  else fallbackCopy(t);
}
function fallbackCopy(t){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Скопійовано")}catch(e){toast("Виділіть і скопіюйте вручну")}a.remove()}
function getSit(g){for(var i=0;i<S.length;i++)if(S[i].g==g)return S[i];return null}
function optOf(sit,nid,k){var n=sit.nodes[nid];if(!n)return null;for(var i=0;i<n.o.length;i++)if(n.o[i].k===k)return n.o[i];return null}
function nextOf(sit,nid,opt){return opt.go!==undefined?opt.go:(sit.nodes[nid].nx||null)}
function stepLabel(nid){return nid==="R"?"Відновлення":"Рішення "+nid}
function algHtml(sit){
  var h='<ol class="alg">';
  sit.alg.forEach(function(a,i){h+='<li><div><span class="st">'+STAGES[i]+'.</span>'+esc(a)+'</div></li>'});
  return h+'</ol>';
}
function store(){try{return JSON.parse(localStorage.getItem("infosim_results")||"{}")}catch(e){return {}}}
function saveLocal(g,code){try{var s=store();s[g]=code;localStorage.setItem("infosim_results",JSON.stringify(s))}catch(e){}}

/* ---------- режим групи ---------- */
var P = new URLSearchParams(location.search);
var MIN = Math.min(30,Math.max(1,parseFloat(P.get("min"))||6));
var st = null, tick = null;

function home(){
  var h='<h1>🕘 Один день учителя</h1><p class="sub">Симулятор «Безпечний інфопростір учителя» · Зупинись • Перевір • Захисти</p>';
  h+='<div class="card"><p>Оберіть свою групу. Кожна група працює з власною ситуацією.</p>';
  S.forEach(function(s){h+='<button class="gbtn" onclick="intro('+s.g+')"><span class="tag">Група '+s.g+'</span><div class="t">'+s.ic+' '+esc(s.n)+'</div><div class="sub" style="margin:0">'+esc(s.ch)+'</div></button>'});
  h+='</div>';
  app.className="w";app.innerHTML=h;
}

function intro(g){
  var s=getSit(g);if(!s)return home();
  var h='<h1>'+s.ic+' '+esc(s.n)+'</h1><p class="sub"><span class="tag">Група '+s.g+'</span> &nbsp;'+esc(s.ch)+'</p>';
  h+='<div class="card"><p class="big">'+esc(s.role)+'</p>';
  h+='<div class="box in"><b>Як працюємо</b><ul>'+
     '<li>Протягом дня ви отримаєте <b>4 повідомлення чи події</b>. Для кожної оберіть дію, обговоривши її в групі.</li>'+
     '<li>Після кожного рішення ви побачите його <b>наслідки</b>. Повернутися назад не можна, як і в житті.</li>'+
     '<li>На всю ситуацію у вас <b>'+fmt(MIN*60)+' хв</b>. Якщо час вичерпається, ви побачите правильний порядок дій.</li>'+
     '<li>Наприкінці ви отримаєте <b>код результату</b>. Надішліть його викладачу.</li></ul></div>';
  h+='<div class="row"><button class="b" onclick="begin('+s.g+')">▶ Почати (таймер запуститься)</button></div></div>';
  app.className="w";app.innerHTML=h;
}

function begin(g){
  var s=getSit(g);
  st={g:g,sit:s,node:s.start,chain:[],t0:Date.now(),stepT0:Date.now(),end:Date.now()+MIN*60000,pending:null,done:false,to:false};
  clearInterval(tick);tick=setInterval(upd,250);
  showNode();
}

function timerHtml(){
  var n=st.chain.length+(st.pending?0:1);
  return '<div class="bar"><div class="tm" id="tm"><span>⏱</span><span class="clock" id="clk">'+fmt((st.end-Date.now())/1000)+'</span><div class="prog"><i id="pg" style="width:100%"></i></div><span class="steps">'+(st.node==="R"?"відновлення":"крок "+Math.min(n,4)+" з 4")+'</span></div></div>';
}
function upd(){
  if(!st||st.done)return;
  var left=(st.end-Date.now())/1000, el=$("clk");
  if(el){el.textContent=fmt(left);var p=Math.max(0,left/(MIN*60))*100;$("pg").style.width=p+"%";
    var tm=$("tm");tm.className="tm"+(left<=30?" crit":left<=60?" warn":"");}
  if(left<=0)finish(true);
}

function showNode(){
  var s=st.sit,n=s.nodes[st.node];
  var h=timerHtml();
  h+='<div class="card"><span class="tag">Група '+s.g+' · '+esc(s.n)+'</span>';
  h+='<div class="msg"><div class="hd"><span>'+esc(n.from)+'</span><b>'+esc(n.t)+'</b></div>';
  if(n.subj)h+='<div class="subj">'+esc(n.subj)+'</div>';
  h+='<div>'+esc(n.msg)+'</div>';
  if(n.att)h+='<div class="att">'+esc(n.att)+'</div>';
  h+='</div><div class="q">'+esc(n.q)+'</div>';
  n.o.forEach(function(o){h+='<button class="o" onclick="choose(\''+o.k+'\')"><b>'+o.k+'</b><span>'+esc(o.t)+'</span></button>'});
  h+='</div>';
  app.className="w";app.innerHTML=h;window.scrollTo(0,0);upd();
}

function choose(k){
  if(st.done||st.pending)return;
  var s=st.sit,o=optOf(s,st.node,k);
  var sec=Math.round((Date.now()-st.stepT0)/1000);
  st.chain.push({n:st.node,k:k,sec:sec});
  st.pending={o:o,next:nextOf(s,st.node,o)};
  var n=s.nodes[st.node];
  var h=timerHtml();
  h+='<div class="card"><span class="tag">Група '+s.g+' · '+esc(s.n)+'</span>';
  h+='<div class="msg"><div class="hd"><span>'+esc(n.from)+'</span><b>'+esc(n.t)+'</b></div><div>'+esc(n.q)+'</div></div>';
  h+='<p><b>Ваше рішення:</b> '+esc(o.t)+'</p>';
  h+='<div class="cons"><b>Що сталося далі:</b><br>'+esc(o.c)+'</div>';
  h+='<div class="row"><button class="b" onclick="goNext()">'+(st.pending.next?"Далі →":"Завершити день ✔")+'</button></div></div>';
  app.innerHTML=h;window.scrollTo(0,0);upd();
}

function goNext(){
  if(st.done)return;
  var nx=st.pending.next;st.pending=null;
  if(!nx)return finish(false);
  st.node=nx;st.stepT0=Date.now();showNode();
}

function makeCode(){
  var ch=st.chain.map(function(c){return c.n+c.k}).join(".");
  var tm=st.chain.map(function(c){return c.sec}).join(".");
  return "IS-G"+st.g+"-"+(ch||"0")+"-"+(tm||"0")+"-"+(st.to?"to":"ok")+"-"+MIN;
}

function finish(timeout){
  if(st.done)return;
  st.done=true;st.to=!!timeout;clearInterval(tick);
  var code=makeCode();saveLocal(st.g,code);
  var s=st.sit,used=Math.round((Date.now()-st.t0)/1000);
  var h='<h1>'+s.ic+' '+esc(s.n)+'</h1><p class="sub"><span class="tag">Група '+s.g+'</span></p>';
  if(timeout){
    h+='<div class="card"><div class="box er"><b>⏰ Час вичерпано.</b> Ви встигли ухвалити рішень: '+st.chain.length+'. Нижче наведено правильний порядок дій у цій ситуації — він знадобиться під час спільного обговорення.</div>';
    h+='<h2>✅ Правильний порядок дій</h2>'+algHtml(s)+'</div>';
  } else {
    h+='<div class="card"><div class="box ok"><b>✔ День завершено вчасно</b> за '+fmt(used)+' з '+fmt(MIN*60)+'.</div></div>';
  }
  h+='<div class="card"><h2>📨 Код результату для викладача</h2><p class="sub">Скопіюйте код і надішліть його в чат заняття.</p>';
  h+='<div class="code" id="code">'+code+'</div><div class="row"><button class="b" onclick="copy(\''+code+'\')">Скопіювати код</button></div></div>';
  h+='<div class="card"><h2>🔗 Ваш ланцюжок рішень</h2>'+chainHtml(s,st.chain,timeout,false)+'</div>';
  if(!timeout){
    h+='<div class="card"><details><summary>Показати правильний порядок дій</summary>'+algHtml(s)+'</details></div>';
  }
  app.className="w";app.innerHTML=h;window.scrollTo(0,0);
}

/* ланцюжок рішень (для групи й викладача) */
function chainHtml(s,chain,timeout,showGrade){
  var h='<ul class="chain">',last=null;
  chain.forEach(function(c){
    var n=s.nodes[c.n],o=optOf(s,c.n,c.k);if(!n||!o)return;
    var g=GR[o.g];
    h+='<li class="'+(showGrade?o.g:"")+'"><div class="meta">'+esc(n.t)+' · '+stepLabel(c.n)+' · ⏱ '+fmt(c.sec)+'</div>';
    h+='<div><b>'+o.k+'.</b> '+esc(o.t)+'</div>';
    if(showGrade)h+='<span class="chip '+o.g+'">'+g[0]+' '+g[1]+'</span>';
    h+='</li>';
    last={n:c.n,o:o};
  });
  if(timeout){
    // кроки, до яких не дійшли
    var nid=last?nextOf(s,last.n,last.o):s.start, guard=0;
    while(nid&&guard++<8){var n=s.nodes[nid];h+='<li class="miss"><div class="meta">'+esc(n.t)+' · '+stepLabel(nid)+'</div>Не встигли: '+esc(n.q)+'</li>';nid=n.nx||null}
  }
  return h+'</ul>';
}

/* ---------- режим викладача ---------- */
function parseCodes(text){
  var re=/IS-G([1-3])-([0-9RA-D.]+)-([0-9.]+)-(ok|to)(?:-(\d+(?:\.\d+)?))?/g,m,res={};
  while((m=re.exec(text))){
    var g=+m[1],s=getSit(g);if(!s)continue;
    var ks=m[2]==="0"?[]:m[2].split("."),ts=m[3].split("."),chain=[],ok=true;
    ks.forEach(function(p,i){var nid=p.slice(0,-1),k=p.slice(-1);if(!optOf(s,nid,k))ok=false;chain.push({n:nid,k:k,sec:+ts[i]||0})});
    if(ok)res[g]={g:g,chain:chain,to:m[4]==="to",min:m[5]?+m[5]:null,raw:m[0]};
  }
  return res;
}

function teacher(){
  var base=location.href.split("#")[0].split("?")[0];
  var h='<h1>👩‍🏫 Панель викладача</h1><p class="sub">Симулятор «Один день учителя» · ланцюжки рішень груп</p>';
  h+='<div class="card noprint"><h2>1. Посилання для груп</h2><div class="row" style="margin-top:0"><label>Час на ситуацію, хв: <input type="number" id="mins" min="1" max="30" step="1" value="'+MIN+'"></label></div><div id="links"></div></div>';
  h+='<div class="card noprint"><h2>2. Коди результатів</h2><p class="sub">Вставте коди груп. Можна вставити весь текст із чату — коди буде знайдено автоматично.</p>';
  h+='<textarea id="codes" placeholder="IS-G1-…&#10;IS-G2-…&#10;IS-G3-…"></textarea>';
  h+='<div class="row"><button class="b" onclick="board()">Показати ланцюжки</button><button class="b g" onclick="loadLocal()">Результати з цього пристрою</button><button class="b g" onclick="demo()">Демо-приклад</button></div></div>';
  h+='<div id="board"></div>';
  h+='<div class="card"><details id="algs"><summary>Правильний порядок дій у всіх ситуаціях (для обговорення)</summary><div class="grid" style="margin-top:10px">';
  S.forEach(function(s){h+='<div><h2>'+s.ic+' Група '+s.g+': '+esc(s.n)+'</h2>'+algHtml(s)+'</div>'});
  h+='</div></details></div>';
  app.className="w wide";app.innerHTML=h;
  var draw=function(){
    var m=Math.min(30,Math.max(1,parseFloat($("mins").value)||6)),L="";
    S.forEach(function(s){var u=base+"?g="+s.g+"&min="+m;
      L+='<div class="lnk"><b>Група '+s.g+'</b> '+s.ic+'<code>'+esc(u)+'</code><button class="b g" onclick="copy(\''+u+'\')">Копіювати</button><a class="b g" href="'+u+'" target="_blank" rel="noopener">Відкрити</a></div>'});
    $("links").innerHTML=L;
  };
  $("mins").addEventListener("input",draw);draw();
}
function loadLocal(){var s=store(),t=[];for(var k in s)t.push(s[k]);if(!t.length){toast("На цьому пристрої результатів ще немає");return}$("codes").value=t.join("\n");board()}
function demo(){$("codes").value="IS-G1-1A.RD.2C.3B.4D-48.35.40.52.30-ok-6\nIS-G2-1D.2C.3D.4B-60.75.90.44-ok-6\nIS-G3-1C.2B-95.140-to-6";board()}

function board(){
  var r=parseCodes($("codes").value),h='',n=0;
  S.forEach(function(s){
    var x=r[s.g];
    h+='<div class="card"><h2>'+s.ic+' Група '+s.g+': '+esc(s.n)+'</h2>';
    if(!x){h+='<p class="sub">Код ще не надіслано.</p></div>';return}
    n++;
    var c={ok:0,part:0,bad:0},tot=0;
    x.chain.forEach(function(ci){var o=optOf(s,ci.n,ci.k);c[o.g]++;tot+=ci.sec});
    h+='<div class="row" style="margin-top:0">'+(x.to?'<span class="chip bad">⏰ Не встигли</span>':'<span class="chip ok">✔ Вчасно</span>')+
       '<span class="chip in">⏱ '+fmt(tot)+(x.min?' з '+fmt(x.min*60):'')+'</span>'+
       '<span class="chip ok">✅ '+c.ok+'</span><span class="chip part">🟡 '+c.part+'</span><span class="chip bad">❌ '+c.bad+'</span></div>';
    h+=chainHtml(s,x.chain,x.to,true);
    h+='<details'+(x.to?' open':'')+'><summary>Правильний порядок дій</summary>'+algHtml(s)+'</details></div>';
  });
  $("board").innerHTML='<div class="grid">'+h+'</div>';
  if(!n)toast("Кодів не знайдено");
}

/* ---------- запуск ---------- */
if(/teacher/i.test(location.hash)||P.has("teacher"))teacher();
else if(P.get("g")&&getSit(P.get("g")))intro(+P.get("g"));
else home();
window.addEventListener("hashchange",function(){if(/teacher/i.test(location.hash))teacher()});
</script>
